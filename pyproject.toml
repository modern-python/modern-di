[project]
name = "modern-di"
description = "Powerful dependency-injection framework with IoC container and scopes"
authors = [{ name = "Artur Shiriev", email = "me@shiriev.ru" }]
requires-python = ">=3.10,<4"
license = "MIT"
readme = "README.md"
keywords = ["dependency-injection", "di", "ioc-container", "scopes", "mocks", "python"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries",
]
version = "0"

[build-system]
requires = ["uv_build>=0.11,<1.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "modern_di"
module-root = ""

[project.urls]
Homepage = "https://modern-di.modern-python.org"
Documentation = "https://modern-di.modern-python.org"
Repository = "https://github.com/modern-python/modern-di"
Issues = "https://github.com/modern-python/modern-di/issues"
Changelog = "https://github.com/modern-python/modern-di/releases"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-repeat",
    "pytest-benchmark",
]
lint = [
    "ruff",
    "ty",
    "eof-fixer",
    "typing-extensions",
]

[tool.ty.src]
exclude = ["benchmarks/comparative"]

[tool.ruff]
fix = true
unsafe-fixes = true
line-length = 120
extend-exclude = ["docs", "benchmarks/comparative"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D1",     # docstrings are not forced; a docstring exists when it says something
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "COM812", # conflicts with the formatter
    "ISC001", # conflicts with the formatter
    "CPY001", # no per-file copyright header
    "FBT",    # boolean positional arguments are fine
    "TCH",    # imports stay real; TYPE_CHECKING-only imports break runtime introspection
]
isort.lines-after-imports = 2
isort.no-lines-before = ["standard-library", "local-folder"]

[tool.ruff.lint.per-file-ignores]
# The resolver compiler reads `Factory._creator` and friends by design (one compiler, closed provider
# set), and every resolver returns `typing.Any`.
"modern_di/resolver_compiler.py" = ["SLF001", "ANN401"]
# White-box tests assert on container and registry internals; that is what they are for.
"tests/**" = ["S101", "SLF001"]
# Guard-tier benchmarks are pytest tests too: they assert on the measured ratios.
"benchmarks/**" = ["S101"]

[tool.pytest.ini_options]
addopts = ""
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = []
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage]
run.concurrency = ["thread"]
run.omit = ["benchmarks/*"]
report.exclude_also = ["if typing.TYPE_CHECKING:"]
report.fail_under = 100
